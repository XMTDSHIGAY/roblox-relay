services:
  - type: web
    name: roblox-relay
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: node server.cjs
    healthCheckPath: /health
    envVars:
      - key: RELAY_TOKEN
        sync: false
      - key: DISCORD_WEBHOOKS
        sync: false
      - key: DISCORD_PROXY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_FILE
        value: game.json
      - key: GITHUB_BRANCH
        value: main
